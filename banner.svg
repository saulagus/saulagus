<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Saúl Güemes — animated equalizer banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"  stop-color="#f7768e"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7aa2f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style><![CDATA[
      @keyframes eq1 { 0%,100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
      @keyframes eq2 { 0%,100% { transform: scaleY(0.6);  } 50% { transform: scaleY(0.25); } }
      @keyframes eq3 { 0%,100% { transform: scaleY(0.8);  } 50% { transform: scaleY(0.4); } }
      @keyframes eq4 { 0%,100% { transform: scaleY(0.45); } 50% { transform: scaleY(0.9); } }
      @keyframes eq5 { 0%,100% { transform: scaleY(0.7);  } 50% { transform: scaleY(0.3); } }
      @keyframes eq6 { 0%,100% { transform: scaleY(0.3);  } 50% { transform: scaleY(0.75); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0.3; } }

      .bar { transform-origin: center bottom; transform-box: fill-box; }
      .b1 { animation: eq1 0.9s ease-in-out infinite; }
      .b2 { animation: eq2 1.1s ease-in-out infinite; }
      .b3 { animation: eq3 0.7s ease-in-out infinite; }
      .b4 { animation: eq4 1.3s ease-in-out infinite; }
      .b5 { animation: eq5 0.8s ease-in-out infinite; }
      .b6 { animation: eq6 1.0s ease-in-out infinite; }

      .vinyl { transform-origin: 105px 110px; transform-box: fill-box; animation: spin 6s linear infinite; }
      .cursor { animation: blink 1s step-end infinite; }
      .fadein { animation: fadeIn 1.4s ease-out both; }

      .title { font-family: 'JetBrains Mono','Fira Code',ui-monospace,monospace; font-weight: 700; fill: #c0caf5; }
      .sub   { font-family: 'JetBrains Mono','Fira Code',ui-monospace,monospace; font-weight: 400; fill: #7aa2f7; letter-spacing: 2px; }
      .accent { fill: #f7768e; }
      .muted  { fill: #565f89; }
    ]]></style>
  </defs>

  <!-- background -->
  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- faint grid lines for texture -->
  <g stroke="#414868" stroke-width="0.5" opacity="0.35">
    <line x1="0" y1="55"  x2="900" y2="55"/>
    <line x1="0" y1="110" x2="900" y2="110"/>
    <line x1="0" y1="165" x2="900" y2="165"/>
  </g>

  <!-- spinning vinyl on the left -->
  <g class="fadein" transform="translate(0,0)">
    <circle cx="105" cy="110" r="65" fill="#16161e" stroke="#414868" stroke-width="1"/>
    <g class="vinyl">
      <circle cx="105" cy="110" r="62" fill="none" stroke="#2a2e3f" stroke-width="1"/>
      <circle cx="105" cy="110" r="52" fill="none" stroke="#2a2e3f" stroke-width="1"/>
      <circle cx="105" cy="110" r="42" fill="none" stroke="#2a2e3f" stroke-width="1"/>
      <circle cx="105" cy="110" r="32" fill="none" stroke="#2a2e3f" stroke-width="1"/>
      <circle cx="105" cy="110" r="22" fill="#bb9af7"/>
      <circle cx="105" cy="110" r="4"  fill="#1a1b26"/>
      <!-- highlight streak to make rotation visible -->
      <path d="M 105 48 A 62 62 0 0 1 167 110" fill="none" stroke="#7aa2f7" stroke-width="1.5" opacity="0.55"/>
    </g>
  </g>

  <!-- equalizer bars, right of vinyl -->
  <g class="fadein" transform="translate(210,145)" filter="url(#glow)">
    <rect class="bar b1" x="0"   y="-70" width="14" height="70" rx="3" fill="url(#bar)"/>
    <rect class="bar b2" x="22"  y="-70" width="14" height="70" rx="3" fill="url(#bar)"/>
    <rect class="bar b3" x="44"  y="-70" width="14" height="70" rx="3" fill="url(#bar)"/>
    <rect class="bar b4" x="66"  y="-70" width="14" height="70" rx="3" fill="url(#bar)"/>
    <rect class="bar b5" x="88"  y="-70" width="14" height="70" rx="3" fill="url(#bar)"/>
    <rect class="bar b6" x="110" y="-70" width="14" height="70" rx="3" fill="url(#bar)"/>
    <rect class="bar b2" x="132" y="-70" width="14" height="70" rx="3" fill="url(#bar)"/>
    <rect class="bar b4" x="154" y="-70" width="14" height="70" rx="3" fill="url(#bar)"/>
  </g>

  <!-- title block -->
  <g class="fadein">
    <text x="410" y="95" class="title" font-size="36">Saúl Güemes</text>
    <text x="410" y="125" class="sub" font-size="13">CS · AI · MANDARIN · METAL</text>
    <text x="410" y="165" class="muted" font-family="JetBrains Mono,monospace" font-size="13">
      <tspan class="accent">$</tspan> whoami<tspan class="cursor" fill="#c0caf5">_</tspan>
    </text>
  </g>
</svg>
